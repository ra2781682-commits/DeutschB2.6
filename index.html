<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>د آلماني B2 لغاتونه</title>
<style>
:root{--bg:#111b22;--card:#1a2830;--fg:#e8f0f2;--acc:#e6b84a;--ok:#4c9a50;--bad:#c53b32;--hd:#2f6a6e;--fc:#eaf5f4;--fct:#274a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3f5;--card:#fff;--fg:#1b2a33;--fc:#f4fbfa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Naskh Arabic",Tahoma,system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--hd),#2b5675);text-align:center;padding:22px 12px;border-bottom:4px solid var(--acc);color:#fff}
h1{margin:0 0 6px;font-size:1.6rem}
.bar{max-width:520px;margin:10px auto 4px;height:14px;background:#ffffff40;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s;margin-right:0}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px}
button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid #ffffff30;border-radius:22px;padding:9px 16px}
button.on{background:var(--hd);color:#fff}
main{max-width:720px;margin:0 auto;padding:0 14px 30px}
.box{background:var(--card);border-radius:20px;padding:16px;border:1px solid #ffffff20}
.fc{background:var(--fc);color:var(--fct);border:3px solid var(--acc);border-radius:22px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;margin:12px 0}
.de{font-size:2rem;font-weight:700;direction:ltr}
.ps{font-size:1.6rem}
.hint{opacity:.6;margin-top:10px;font-size:.95rem}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.know{background:var(--ok);color:#fff}.dont{background:var(--bad);color:#fff}
.opt{display:block;width:100%;margin:8px 0;text-align:center;border-radius:14px}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.q{font-size:1.8rem;text-align:center;direction:ltr;font-weight:700;margin:10px}
table{width:100%;border-collapse:collapse}
td{padding:8px;border-bottom:1px solid #ffffff20}
td:first-child{direction:ltr;text-align:left;font-weight:600}
input{font:inherit;width:100%;padding:9px;border-radius:12px;border:1px solid #ffffff40;background:var(--bg);color:var(--fg);margin-bottom:10px}
.c{text-align:center}
</style>
</head>
<body>
<header>
<h1>📘 د آلماني B2 لغاتونه</h1>
<div>Aspekte neu B2 · کاپټل ۲–۳ · د پښتو ترجمې سره</div>
<div class="bar"><i id="pb"></i></div>
<div id="pt"></div>
</header>
<nav id="nav">
<button data-t="cards" class="on">🃏 کارتونه</button>
<button data-t="quiz">❓ ازموينه</button>
<button data-t="art">🎯 آرتيکل</button>
<button data-t="list">📖 لیست</button>
</nav>
<main id="m"></main>
<script>
// [آلماني, پښتو, آرتيکل/article (اختياري)]
const W=[
["nerven","ځورول، عصبي کول"],["berücksichtigen","په پام کې نیول"],["hektisch","ګړندی او بې آرامه"],["verlangen","غوښتل، تقاضا کول"],
["das Tagebuch","ورځپاڼه (شخصي یادښتونه)"],["der Vorwurf","ملامتي"],["der Ausgang","پای، وتلو ځای"],
["der Bibliothekar","کتابتون وال"],["das Cello","چېلو (موسیقي وسیله)"],["die Ich-Botschaft","زه-پیغام"],
["die Mitschrift","یادښت (د لیکچر)"],["die Probe","تمرین، نمونه"],["der Probenraum","د تمرین خونه"],
["die Rücksicht","درناوی، پام"],["das Seminar","سیمینار"],["der Strandurlaub","د ساحل رخصتي"],
["der Telefonist","ټلیفون چلوونکی"],["die Umschulung","بیا روزنه"],["zurückkehren","بیرته راستنېدل"],
["zugleich","په یو وخت کې"],["die Zugabe","اضافي (د کنسرټ)"],["unbedingt","حتماً"],["ungefragt","بې پوښتنې"],
["spüren","احساس کول"],["systematisch","منظم"],["smart","هوښیار"],["poetisch","شاعرانه"],["platt","هواره، ساده"],
["das Schicksal","برخلیک"],["die Macht","ځواک، قدرت"],["die Last","بار"],["die Gunst","مهرباني، لورینه"],
["hervorragend","ډېر ښه، عالي"],["klatschen","ګوتې/لاسونه وهل"],["der Komponist","موسیقي جوړوونکی"],
["der Walzer","والټس (نڅا)"],["die Dringlichkeit","بیړه، بیړنیتوب"],["brillieren","ځلېدل، غوره والی ښودل"],
["bewusst","پوه، هوښیار"],["abgesehen von","پرته له"],["blitzen","برېښنا کول"],["gewittern","تندر کول"],
["hageln","ږلۍ اورېدل"],["nieseln","نری باران کېدل"],["stürmen","توپان کېدل"],["obligatorisch","اجباري"],
["der Bestandteil","برخه، جز"],["betreiben","چلول"],["durchhalten","صبر کول، دوام ورکول"],["das Handwerk","لاسي کسب"],
["hauptberuflich","د اصلي دندې په توګه"],["kreieren","جوړول، خلق کول"],["die Mode","فېشن"],["der Nervenkitzel","هیجان"],
["der Zeitvertreib","د وخت تېرولو کار"],["die Ausdauer","زغم، استقامت"],["dekorieren","سجاوټ کول"],
["einrichten","تنظیمول، سمبالول"],["einsehen","پوهېدل، منل"],["die Arztpraxis","د ډاکټر کلینیک"],
["die Rezeptur","نسخه، د جوړولو طریقه"],["das Shampoo","شامپو"],["die Hautcreme","د پوستکي کريم"],
["vorkommen","پېښېدل، واقع کېدل"],["ziehen (ein Resümee ziehen)","پایله ایستل"],["ziehen (Es zieht.)","هوا تېرېږي (د هوا جریان)"],
["nehmen (Rücksicht nehmen)","اخیستل (پام کول)"],["daherkommen","راتلل، راښکاره کېدل"],["gezeichnet sein","نښه شوی وي، اغېزمن شوی"],
["der Indie-Pop","انډي پاپ (د موسیقۍ ډول)"],["phrasieren","د موسیقۍ جملې جلا کول"],["der Wahrnehmungsbereich","د احساس/درک ساحه"],
["abgesehen (es auf jmd. abgesehen haben)","چا ته ګوته نیول، په چا سترګه لرل"],["der Blogger","بلاګر"],["der Geruchssinn","د بویولو حس"],
["hängen (den Job an den Nagel hängen)","ځورندول (دنده پرېښودل)"],["der Lifestyle","د ژوند سبک"],["der Nagel","ميخ"],
["der Stuntman","د خطرناکو صحنو لوبغاړی"],["die Stuntschule","د سټنټ ښوونځی"],["der Werbepartner","د اعلان ملګری"],
["drauf","پر هغه، پر دې"],["einstellen (sich)","ځان چمتو کول، سمول"]
];
const S={tab:"cards",i:0,known:new Set(),flip:false,q:null,pool:W.map((_,i)=>i)};
const $=s=>document.querySelector(s);
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
function art(w){const m=w[0].match(/^(der|die|das) /);return m?m[1]:null}
function prog(){const n=S.known.size;$("#pb").style.width=(n/W.length*100)+"%";$("#pt").textContent=`${W.length} له ${n} لغاتونه زده شول (${Math.round(n/W.length*100)}٪)`}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function render(){
 prog();
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
 const m=$("#m");
 if(S.tab==="cards"){
  const w=W[S.i];
  m.innerHTML=`<div class="box"><div class="c">کارت ${fa(S.i+1)} له ${fa(W.length)}</div>
  <div class="fc" id="fc">${S.flip?`<div class="ps">${w[1]}</div>`:`<div class="de">${w[0]}</div><div class="hint" id="sp">🔊 تک ورکړه</div>`}</div>
  <div class="row"><button id="pv">◀ مخکینی</button><button class="dont" id="dk">لا زده کوم</button><button class="know" id="kn">پوهېږم ✓</button><button id="nx">راتلونکی ▶</button></div>
  <p class="c"><button id="rs">↺ له سره پیل</button></p></div>`;
  $("#fc").onclick=e=>{if(e.target.id==="sp"){speak(w[0]);return}S.flip=!S.flip;render()};
  const go=d=>{S.i=(S.i+d+W.length)%W.length;S.flip=false;render()};
  $("#nx").onclick=()=>go(1);$("#pv").onclick=()=>go(-1);
  $("#kn").onclick=()=>{S.known.add(S.i);go(1)};
  $("#dk").onclick=()=>{S.known.delete(S.i);go(1)};
  $("#rs").onclick=()=>{S.known.clear();S.i=0;S.flip=false;render()};
 }
 else if(S.tab==="quiz"){
  if(!S.q){const a=Math.floor(Math.random()*W.length);let o=[a];while(o.length<4){const r=Math.floor(Math.random()*W.length);if(!o.includes(r))o.push(r)}o.sort(()=>Math.random()-.5);S.q={a,o,d:false}}
  m.innerHTML=`<div class="box"><div class="q">${W[S.q.a][0]}</div>${S.q.o.map(i=>`<button class="opt" data-i="${i}">${W[i][1]}</button>`).join("")}<p class="c"><button id="nq">راتلونکې ▶</button></p></div>`;
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.q.d)return;S.q.d=true;const i=+b.dataset.i;b.classList.add(i===S.q.a?"right":"wrong");m.querySelectorAll(".opt").forEach(x=>{if(+x.dataset.i===S.q.a)x.classList.add("right")})});
  $("#nq").onclick=()=>{S.q=null;render()};
 }
 else if(S.tab==="art"){
  const A=W.filter(w=>art(w));
  if(!S.q||S.q.t!=="art"){S.q={t:"art",w:A[Math.floor(Math.random()*A.length)],d:false}}
  const w=S.q.w;
  m.innerHTML=`<div class="box"><div class="q">${w[0].replace(/^(der|die|das) /,"")}</div><div class="c">${w[1]}</div>
  <div class="row" style="margin-top:14px">${["der","die","das"].map(x=>`<button class="opt" style="width:auto;padding:10px 26px" data-a="${x}">${x}</button>`).join("")}</div>
  <p class="c"><button id="nq">راتلونکې ▶</button></p></div>`;
  m.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(S.q.d)return;S.q.d=true;const r=art(w);b.classList.add(b.dataset.a===r?"right":"wrong");m.querySelectorAll("[data-a]").forEach(x=>{if(x.dataset.a===r)x.classList.add("right")})});
  $("#nq").onclick=()=>{S.q=null;render()};
 }
 else{
  m.innerHTML=`<div class="box"><input id="s" placeholder="🔍 لټون..."><table id="tb"></table></div>`;
  const fill=f=>{$("#tb").innerHTML=W.filter(w=>(w[0]+w[1]).toLowerCase().includes(f)).map(w=>`<tr><td>${w[0]}</td><td>${w[1]}</td></tr>`).join("")};
  fill("");$("#s").oninput=e=>fill(e.target.value.toLowerCase());
 }
}
$("#nav").onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;S.q=null;render()}};
render();
</script>
</body>
</html>
